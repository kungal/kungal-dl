server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/plain text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # The page is fully self-contained (inline CSS/JS, no third-party requests) —
    # the strict CSP both enforces and demonstrates that.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    location = /favicon.svg {
        expires 7d;
    }

    location ^~ /.well-known/ {
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
        expires 10m;
    }
}
