# kungal-dl — PRODUCTION compose (Dokploy + GHCR prebuilt image).
#
# Same deployment model as the other KUN Galgame apps:
#   1. `image: ghcr.io/kungal/kungal-dl` — NOT `build:`. CI builds+pushes
#      (.github/workflows/build.yml); Dokploy only PULLS.
#   2. `expose:` (container-network only), not `ports:` — Traefik routes
#      internally; attach the domains (imoe.uk + dl.imoe.uk) to the `dl`
#      service, container port 80, in Dokploy.
#   3. network = `dokploy-network` (external), shared by the Dokploy apps.
#
# No environment, no volumes, no secrets — a fully static nginx image. The
# container healthcheck ships in the Dockerfile (wget against /).
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  dl:
    image: ghcr.io/kungal/kungal-dl:latest
    pull_policy: always
    expose: ["80"]
    restart: unless-stopped

networks:
  default:
    name: dokploy-network
    external: true
